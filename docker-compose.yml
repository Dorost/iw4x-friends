# Linux / VPS: dedicated server + web UI, with Caddy serving the UI over HTTPS.
# Host networking: no Docker NAT on the game's UDP traffic (lower latency, and
# the server sees real player addresses).
services:
  server:
    build: services/ui
    # CI pushes one image per commit on main; scripts/deploy/deploy.sh sets IMAGE_TAG
    # in .env. Without it, --build builds here and tags the result :main.
    image: ghcr.io/dorost/iw4x-friends:${IMAGE_TAG:-main}
    network_mode: host
    restart: unless-stopped
    init: true # reaps exited Wine processes (uv as PID 1 doesn't)
    environment:
      IW4X_SERVER_DIR: /game
      IW4X_PORT: ${IW4X_PORT:-28960}
      UI_PORT: ${UI_PORT:-8080}
      UI_HOST: 127.0.0.1 # only reachable through Caddy
      UI_PASSWORD: ${UI_PASSWORD:?set UI_PASSWORD in .env} # web UI login
      JOIN_HOST: ${JOIN_HOST:-${DOMAIN:-}} # players connect to this name instead of the IP
      UI_DATA_DIR: /data
      AUTOSTART: "1" # start the game server with the container, e.g. after a reboot
      # join and leave messages in a Telegram group (README); empty = none
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_APP_SERVERS: ${TELEGRAM_APP_SERVERS:-} # servers in the Telegram mini app; empty = this one
    volumes:
      - ./game:/game
      - ui-data:/data

  # the "Tonight?" planner bot (README): runs on one server only, the one with
  # COMPOSE_PROFILES=bot in its .env (NL). It is the only program that reads the bot's messages
  bot:
    build: services/bot
    image: iw4x-friends-bot:local # built on the server (scripts/deploy/deploy.sh)
    profiles: [bot]
    network_mode: host
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_APP_SERVERS: ${TELEGRAM_APP_SERVERS:-} # the servers /online and friend alerts ask
      BOT_DEFAULT_TZ: ${BOT_DEFAULT_TZ:-Europe/Amsterdam}
      BOT_MIN_PLAYERS: ${BOT_MIN_PLAYERS:-3}
      BOT_PORT: ${BOT_PORT:-8090}
      BOT_HOST: 127.0.0.1 # only reachable through Caddy (/bot/)
      BOT_DB_PATH: /data/bot.db
    volumes:
      - bot-data:/data

  caddy:
    image: caddy:2.8.4
    network_mode: host
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      UI_PORT: ${UI_PORT:-8080}
      BOT_PORT: ${BOT_PORT:-8090}
    volumes:
      - ./services/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  bot-data:
  caddy-data:
  ui-data:

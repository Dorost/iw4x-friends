name: deploy

# Deploys the commit to the bastion (deploy/README.md), from ci.yml and bastion.yml. The settings
# go along on stdin, made from the secrets and variables of the "bastion" environment; the SSH
# key can only run deploy/bastion/deploy.sh. The bastion is checked against its host key, whose
# private half is the BASTION_SSH_HOST_KEY secret: the bastion workflow gives every new bastion
# that key, so nothing about it is in the repo.

on:
  workflow_call:
    inputs:
      new-bastion:
        description: The bastion was just created, wait for it to take SSH connections
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bastion:
    runs-on: ubuntu-latest
    environment:
      name: bastion
      url: https://mw2.dorost.nl
    concurrency: deploy-bastion # one at a time; a newer one replaces one still waiting
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: deploy

      - name: Deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          BASTION_SSH_HOST_KEY: ${{ secrets.BASTION_SSH_HOST_KEY }}
          NEW_BASTION: ${{ inputs.new-bastion }}
          TRIES: ${{ inputs.new-bastion && 40 || 3 }}
          # what the bastion gets (deploy/bastion/docker-compose.yml); empty ones are left out
          UI_PASSWORD: ${{ secrets.UI_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          ZENLAYER_ACCESS_KEY_ID: ${{ secrets.ZENLAYER_ACCESS_KEY_ID }}
          ZENLAYER_ACCESS_KEY_PASSWORD: ${{ secrets.ZENLAYER_ACCESS_KEY_PASSWORD }}
          CLOUDFLARE_DNS_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
          MW_SETUP_PASSWORD: ${{ secrets.MW_SETUP_PASSWORD }}
          ADMIN_SSH_KEYS: ${{ vars.ADMIN_SSH_KEYS }}
          BOT_DEFAULT_TZ: ${{ vars.BOT_DEFAULT_TZ }}
          BOT_MIN_PLAYERS: ${{ vars.BOT_MIN_PLAYERS }}
          IDLE_MINUTES: ${{ vars.IDLE_MINUTES }}
          LEAD_MINUTES: ${{ vars.LEAD_MINUTES }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$BASTION_SSH_HOST_KEY" ]; then
            echo "::notice::No DEPLOY_SSH_KEY or BASTION_SSH_HOST_KEY secret in the bastion environment, nothing deployed. See deploy/README.md"
            exit 0
          fi
          host=$(python3 -c 'import tomllib; print(tomllib.load(open("deploy/fleet.toml", "rb"))["bastion"]["domain"])')

          # the bastion's host key, from the secret's private half
          umask 077
          printf '%s\n' "$BASTION_SSH_HOST_KEY" > "$RUNNER_TEMP/host_key"
          host_key=$(ssh-keygen -y -f "$RUNNER_TEMP/host_key" | cut -d' ' -f1,2)
          rm -f "$RUNNER_TEMP/host_key"
          echo "$host $host_key" > "$RUNNER_TEMP/known_hosts"
          # A push before the bastion exists, while the domain still leads to another machine
          # (it answers with another host key): nothing to deploy to yet, the bastion workflow
          # creates it. No answer at all is not skipped: that's a bastion that is down
          if [ "$NEW_BASTION" != true ]; then
            answer=$(ssh-keyscan -T 15 -t ed25519 "$host" 2>/dev/null | cut -d' ' -f2,3)
            if [ -n "$answer" ] && [ "$answer" != "$host_key" ]; then
              echo "::notice::$host isn't the bastion yet (another SSH host key answers), nothing deployed. Create it with Actions → bastion → Run workflow"
              exit 0
            fi
          fi

          # .env lines, single quoted: compose then takes them as they are ($ and all)
          python3 - > "$RUNNER_TEMP/settings" <<'PY'
          import os, sys
          keys = ["UI_PASSWORD", "TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID", "VULTR_API_KEY",
                  "ZENLAYER_ACCESS_KEY_ID", "ZENLAYER_ACCESS_KEY_PASSWORD", "CLOUDFLARE_DNS_TOKEN",
                  "MW_SETUP_PASSWORD", "ADMIN_SSH_KEYS", "BOT_DEFAULT_TZ", "BOT_MIN_PLAYERS",
                  "IDLE_MINUTES", "LEAD_MINUTES"]
          if not os.environ.get("UI_PASSWORD"):
              sys.exit("the UI_PASSWORD secret is missing")
          for k in keys:
              v = os.environ.get(k, "").strip()
              if k == "ADMIN_SSH_KEYS":  # one key per line in the variable
                  v = ";".join(line.strip() for line in v.splitlines() if line.strip())
              if "'" in v or "\n" in v:
                  sys.exit(f"{k}: a single quote or a line break can't go in .env")
              if v:
                  print(f"{k}='{v}'")
          PY

          eval "$(ssh-agent -s)" >/dev/null
          trap 'ssh-agent -k >/dev/null; rm -f "$RUNNER_TEMP/settings" "$RUNNER_TEMP/known_hosts"' EXIT
          ssh-add -q - <<< "$DEPLOY_SSH_KEY"
          # A new bastion takes a few minutes to answer with its own host key and to have the
          # repo (255: no connection, 127: no deploy script yet); other failures are final
          for (( try = 1; ; try++ )); do
            code=0
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
                -o ConnectTimeout=20 -o ServerAliveInterval=15 "root@$host" deploy "$GITHUB_SHA" \
                < "$RUNNER_TEMP/settings" || code=$?
            if [ "$code" = 0 ]; then break; fi
            if [ "$code" != 255 ] && [ "$code" != 127 ] || [ "$try" -ge "$TRIES" ]; then exit "$code"; fi
            echo "not reachable yet ($code), again in 20 s"
            sleep 20
          done
          echo "$host: \`${GITHUB_SHA:0:7}\` from $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"

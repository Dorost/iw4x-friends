name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      servers:
        description: Servers to deploy this branch to (NL goes first)
        type: choice
        options: [both, nl, us]
        default: both

# Pushes to main wait for each other: a newer one replaces one still waiting, a running
# deploy is never cancelled. On other branches a new push cancels the old run. Run
# workflow has groups of its own, so a push to the branch doesn't cancel its deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/dorost/iw4x-friends

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false # no lockfile, nothing to cache

      - name: Setup scripts carry the current config/client.cfg
        run: uv run scripts/tools/sync-config.py --check

      - name: Lint web UI
        run: uvx ruff@0.17.2 check services/ui

      - name: Shell scripts parse
        run: |
          sudo apt-get install -y -qq zsh
          for f in scripts/*/*.sh scripts/*.sh; do
            if head -1 "$f" | grep -q bash; then bash -n "$f"; else zsh -n "$f"; fi && echo "ok $f"
          done

      - name: Docker compose config valid
        run: DOMAIN=example.com UI_PASSWORD=x docker compose config -q

      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null; $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Host "::error file=$($_.Extent.File),line=$($_.Extent.StartLineNumber)::$($_.Message)" }; $failed = $true }
            else { Write-Host "ok $($_.Name)" }
          }
          if ($failed) { exit 1 }

  # The server image: built and started on every push, pushed to GHCR from main and from
  # Run workflow (to deploy it)
  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.4.1

      # The registry cache keeps the Wine layers byte for byte the same from build to
      # build, so a server only downloads the layers that changed
      - name: Build
        uses: docker/build-push-action@v7.4.0
        with:
          context: services/ui
          load: true
          tags: iw4x-friends:test
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache

      - name: Web UI starts in the image
        run: |
          docker run -d --name ui -p 8080:8080 -e UI_PASSWORD=ci -e AUTOSTART=0 iw4x-friends:test
          for _ in $(seq 30); do curl -fso /dev/null localhost:8080/login && break; sleep 2; done
          curl -fsS -u :ci localhost:8080/api/state | jq -e '.auth and (.running | not)' >/dev/null
          [ "$(curl -so /dev/null -w '%{http_code}' localhost:8080/api/state)" = 401 ]   # login required
      - name: Web UI log
        if: failure()
        run: docker logs ui

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only main moves :main and writes the cache, so a branch with other Wine layers
      # doesn't make the servers download them again on the next deploy from main
      - name: Push
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v7.4.0
        with:
          context: services/ui
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:main', env.IMAGE) || '' }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE) || '' }}

  # One job per server, each with its own environment (and deploy key), NL first: US
  # waits for it and is skipped when it fails. Every push to main deploys main to both.
  # Run workflow deploys the branch it runs on, e.g. a PR's, to the servers picked; the
  # next push to main puts main back. scripts/deploy/deploy.sh on the server pulls the
  # image and restarts the game server only when services/ui changed.
  deploy-nl:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch' && inputs.servers != 'us'
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: nl
      url: https://mw2-nl.dorost.nl
    concurrency: deploy-nl # one deploy at a time; a newer one replaces one still waiting
    env:
      HOST: mw2-nl.dorost.nl
    steps: &deploy
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/deploy

      - name: Deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)" >/dev/null
          trap 'ssh-agent -k >/dev/null' EXIT
          ssh-add -q - <<< "$DEPLOY_SSH_KEY"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=scripts/deploy/known_hosts \
              -o ConnectTimeout=20 -o ServerAliveInterval=15 "root@$HOST" deploy "$GITHUB_SHA"
          echo "$HOST: \`${GITHUB_SHA:0:7}\` from $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"

  deploy-us:
    if: >-
      !cancelled() && needs.image.result == 'success' &&
      (needs.deploy-nl.result == 'success' || needs.deploy-nl.result == 'skipped') && (
        github.event_name == 'push' && github.ref == 'refs/heads/main' ||
        github.event_name == 'workflow_dispatch' && inputs.servers != 'nl')
    needs: [image, deploy-nl]
    runs-on: ubuntu-latest
    environment:
      name: us
      url: https://mw2.dorost.nl
    concurrency: deploy-us
    env:
      HOST: mw2.dorost.nl
    steps: *deploy

name: ci

on:
  push:
  pull_request:
  workflow_dispatch: # deploys the branch it runs on to the bastion (deploy/README.md)

# Pushes to main wait for each other: a newer one replaces one still waiting, a running
# deploy is never cancelled. On other branches a new push cancels the old run. Run
# workflow has groups of its own, so a push to the branch doesn't cancel its deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/dorost/iw4x-friends

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false # no lockfile, nothing to cache

      - name: Setup scripts carry the current config/client.cfg
        run: uv run scripts/tools/sync-config.py --check

      - name: Lint web UI
        run: uvx ruff@0.17.2 check services/ui

      - name: Planner bot tests and lint
        working-directory: services/bot
        run: |
          uv run pytest -q
          uv run black --check .
          uv run ruff check .

      - name: Control plane tests and lint
        working-directory: services/control
        run: |
          uv run pytest -q
          uv run black --check .
          uv run ruff check .

      - name: Shell scripts parse
        run: |
          sudo apt-get install -y -qq zsh
          for f in scripts/*/*.sh scripts/*.sh deploy/*/*.sh; do
            if head -1 "$f" | grep -q bash; then bash -n "$f"; else zsh -n "$f"; fi && echo "ok $f"
          done

      - name: Docker compose configs valid
        run: |
          DOMAIN=example.com UI_PASSWORD=x docker compose --profile bot config -q
          IMAGE_TAG=x UI_PASSWORD=x DOMAIN=example.com docker compose -f deploy/bastion/docker-compose.yml config -q
          IMAGE_TAG=x UI_PASSWORD=x UI_HOST=10.66.0.11 JOIN_HOST=example.com \
            docker compose -f deploy/node/docker-compose.yml config -q

      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null; $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Host "::error file=$($_.Extent.File),line=$($_.Extent.StartLineNumber)::$($_.Message)" }; $failed = $true }
            else { Write-Host "ok $($_.Name)" }
          }
          if ($failed) { exit 1 }

  # The server image: built and started on every push, pushed to GHCR from main and from
  # Run workflow (to deploy it)
  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.4.1

      # The registry cache keeps the Wine layers byte for byte the same from build to
      # build, so a server only downloads the layers that changed
      - name: Build
        uses: docker/build-push-action@v7.4.0
        with:
          context: services/ui
          load: true
          tags: iw4x-friends:test
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache

      - name: Web UI starts in the image
        run: |
          docker run -d --name ui -p 8080:8080 -e UI_PASSWORD=ci -e AUTOSTART=0 iw4x-friends:test
          for _ in $(seq 30); do curl -fso /dev/null localhost:8080/login && break; sleep 2; done
          curl -fsS -u :ci localhost:8080/api/state | jq -e '.auth and (.running | not)' >/dev/null
          [ "$(curl -so /dev/null -w '%{http_code}' localhost:8080/api/state)" = 401 ]   # login required
      - name: Web UI log
        if: failure()
        run: docker logs ui

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only main moves :main and writes the cache, so a branch with other Wine layers
      # doesn't make the servers download them again on the next deploy from main
      - name: Push
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v7.4.0
        with:
          context: services/ui
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:main', env.IMAGE) || '' }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE) || '' }}

  # The bastion's images (deploy/bastion/docker-compose.yml): the control plane and the planner
  # bot, as tags of the same public package (control-<commit>, bot-<commit>). Built and tried on
  # every push, pushed from main and from Run workflow
  bastion-images:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [control, bot]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.4.1

      - name: Build
        uses: docker/build-push-action@v7.4.0
        with:
          context: services/${{ matrix.service }}
          load: true
          tags: iw4x-${{ matrix.service }}:test
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Control plane starts in the image
        if: matrix.service == 'control'
        run: |
          docker run -d --name control -p 8070:8070 -e UI_PASSWORD=ci -e CONTROL_FAKE_CLOUD=1 \
            -e IMAGE_TAG="$GITHUB_SHA" -e FLEET_FILE=/fleet.toml -v "$PWD/deploy/fleet.toml:/fleet.toml:ro" \
            iw4x-control:test
          for _ in $(seq 30); do curl -fso /dev/null localhost:8070/healthz && break; sleep 2; done
          curl -fsS localhost:8070/healthz | jq -e --arg v "$GITHUB_SHA" '.version == $v' >/dev/null
          [ "$(curl -so /dev/null -w '%{http_code}' localhost:8070/api/fleet)" = 401 ]   # login required
          docker exec control sh -c 'command -v wg && command -v ssh'
      - name: Control plane log
        if: failure() && matrix.service == 'control'
        run: docker logs control

      - name: Bot loads in the image
        if: matrix.service == 'bot'
        run: docker run --rm iw4x-bot:test python -c "import bot.core, bot.web"

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v7.4.0
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: ${{ env.IMAGE }}:${{ matrix.service }}-${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}

  # Every push to main deploys main to the bastion; Run workflow deploys the branch it runs on,
  # e.g. a PR's (the next push to main puts main back). The game servers follow by themselves:
  # a running one moves to the new commit once nobody plays on it, the next boot starts on it.
  deploy:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch'
    needs: [image, bastion-images]
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

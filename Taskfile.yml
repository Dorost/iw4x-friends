version: "3"

dotenv: [".env"]

vars:
  PS: powershell -NoProfile -ExecutionPolicy Bypass -File

tasks:
  ui:
    desc: Start the web UI (http://localhost:8080)
    dir: services/ui
    cmds:
      - uv run app.py

  server:
    desc: Start the dedicated server in the foreground (console in terminal)
    cmds:
      - cmd: ./scripts/start-server.sh
        platforms: [darwin]
      - cmd: '{{.PS}} scripts/windows/start-server.ps1'
        platforms: [windows]

  up:
    desc: "Linux: start the server, web UI and Caddy (HTTPS) in Docker"
    platforms: [linux]
    cmds:
      - docker compose up -d --build

  down:
    desc: "Linux: stop the Docker services"
    platforms: [linux]
    cmds:
      - docker compose down

  stop:
    desc: Stop the dedicated server
    cmds:
      - cmd: curl -sf -u ":${UI_PASSWORD}" -X POST localhost:${UI_PORT:-8080}/api/server/stop || pkill -f "^[A-Z]:.*iw4x.exe -dedicated" || true
        platforms: [darwin, linux]
      - cmd: 'powershell -NoProfile -Command "Get-CimInstance Win32_Process -Filter \"Name = ''iw4x.exe''\" | Where-Object CommandLine -match ''-dedicated'' | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }"'
        platforms: [windows]

  config:
    desc: Install server.cfg.example into the game folder (skips if one exists)
    cmds:
      - cmd: ./scripts/install-config.sh
        platforms: [darwin]
      - cmd: 'powershell -NoProfile -Command ". scripts/windows/env.ps1; $t = Join-Path $ServerDir ''main\server.cfg''; if (Test-Path $t) { ''exists, not touching: '' + $t } else { Copy-Item server.cfg.example $t; ''installed: '' + $t }"'
        platforms: [windows]

  game:
    desc: Start the IW4x game with the shared settings, skipping the update check (use when it does not open)
    cmds:
      - cmd: ./scripts/start-game.sh
        platforms: [darwin]
      - cmd: '{{.PS}} scripts/windows/start-game.ps1'
        platforms: [windows]

  game:update:
    desc: Run the IW4x launcher with its update check, then start the game
    cmds:
      - cmd: ./scripts/start-game.sh --update
        platforms: [darwin]
      - cmd: '{{.PS}} scripts/windows/start-game.ps1 -Update'
        platforms: [windows]

  game:kill:
    desc: Stop stuck IW4x launcher/game processes (leaves the dedicated server running)
    cmds:
      - cmd: ./scripts/kill-game.sh
        platforms: [darwin]
      - cmd: '{{.PS}} scripts/windows/kill-game.ps1'
        platforms: [windows]

  setup:
    desc: Set up this machine (game + config; CrossOver on macOS, Docker on Linux). Pass options after --, e.g. task setup -- --force
    cmds:
      - cmd: ./scripts/setup-mac.sh {{.CLI_ARGS}}
        platforms: [darwin]
      - cmd: '{{.PS}} scripts/setup-windows.ps1 {{.CLI_ARGS}}'
        platforms: [windows]
      - cmd: bash scripts/setup-linux.sh {{.CLI_ARGS}}
        platforms: [linux]

  maps:
    desc: Install the custom maps + bots pack into the game (and the server, if it's a separate bottle/folder)
    cmds:
      - cmd: |
          if [ "${IW4X_SERVER_BOTTLE:-mw}" != "${IW4X_GAME_BOTTLE:-mw}" ]; then
            bash scripts/install-maps.sh --bottle "$IW4X_SERVER_BOTTLE" --keep-zip {{.CLI_ARGS}}
          fi
          bash scripts/install-maps.sh --bottle "${IW4X_GAME_BOTTLE:-mw}" {{.CLI_ARGS}}
        platforms: [darwin]
      - cmd: 'powershell -NoProfile -ExecutionPolicy Bypass -Command ". scripts/windows/env.ps1; if ($ServerDir -ne $GameDir) { & scripts/install-maps.ps1 -InstallDir $ServerDir -KeepZip }; & scripts/install-maps.ps1 -InstallDir $GameDir"'
        platforms: [windows]
      - cmd: bash scripts/install-maps.sh --dir game {{.CLI_ARGS}}
        platforms: [linux]

  sync-config:
    desc: Copy config/client.cfg and config/classes.cfg into the standalone setup scripts
    cmds:
      - uv run scripts/sync-config.py

  links:
    desc: Encrypt the mw.zip and maps download links with a password into the setup scripts
    cmds:
      - uv run scripts/encrypt-links.py

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MW2 servers</title>
<!-- Telegram mini app of the fleet (services/control, /tg/): boot and shut down the servers, their map,
     mode and bots. Made from the single server one in services/ui/tg.html -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    /* Telegram's theme, with plain light colors outside Telegram */
    --bg: var(--tg-theme-secondary-bg-color, #f1f1f4);
    --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #fff));
    --text: var(--tg-theme-text-color, #000);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-text: var(--tg-theme-button-text-color, #fff);
    --danger: var(--tg-theme-destructive-text-color, #e53935);
    --sep: var(--tg-theme-section-separator-color, rgba(127, 127, 127, .18));
    --bottom: var(--tg-safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
    color-scheme: light dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  main { max-width: 640px; margin: 0 auto; padding: 12px 12px calc(16px + var(--bottom)); }

  /* server cards */
  .card { background: var(--card); border-radius: 14px; overflow: hidden; margin-bottom: 12px; }
  .banner { position: relative; aspect-ratio: 16 / 9; background: #263238 center / cover no-repeat; color: #fff; }
  .banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,.45), transparent 35%, transparent 45%, rgba(0,0,0,.8)); }
  .banner > * { position: absolute; z-index: 1; left: 14px; right: 14px; }
  .banner .top { top: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .banner .bottom { bottom: 12px; }
  .server { font-weight: 600; font-size: 15px; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
  .status { font-size: 13px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: rgba(0,0,0,.45); backdrop-filter: blur(6px); white-space: nowrap; }
  .status::before { content: "●"; margin-right: 5px; color: #9e9e9e; }
  .status.on::before { color: #4caf50; }
  .status.warn::before { color: #ffb300; }
  .map { font-size: 24px; font-weight: 700; letter-spacing: -.01em; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
  .mode { font-size: 15px; opacity: .92; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  .body { padding: 12px 14px 14px; }
  .players { margin-bottom: 4px; overflow-wrap: anywhere; }
  .hint { color: var(--hint); font-size: 13px; }
  .body .hint { margin-bottom: 12px; }
  .primary, .secondary { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 46px; border-radius: 12px; font-weight: 600; font-size: 16px; }
  .primary { background: var(--accent); color: var(--accent-text); }
  .secondary { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
  .primary:disabled, .secondary:disabled { opacity: .45; cursor: default; }

  .row { display: flex; gap: 8px; }
  .row .primary { flex: 1; width: auto; }
  .icon { flex: none; width: 52px; }

  /* screens: map picker, bots */
  .screen header { padding: 4px 4px 12px; }
  .screen h1 { font-size: 22px; margin: 0; }
  .label { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--hint); margin: 18px 4px 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 8px 14px; border-radius: 99px; background: var(--card); font-weight: 500; }
  .chip.on { background: var(--accent); color: var(--accent-text); }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  @media (min-width: 520px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .tile { position: relative; display: block; text-align: left; border-radius: 12px; overflow: hidden; background: var(--card); outline: 3px solid transparent; outline-offset: -3px; transition: outline-color .12s; }
  .tile .img { aspect-ratio: 16 / 9; background: linear-gradient(135deg, #455a64, #263238) center / cover no-repeat; }
  .tile .name { display: block; padding: 7px 9px 8px; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile.on { outline-color: var(--accent); }
  .tile.on::after { content: "✓"; position: absolute; top: 7px; right: 7px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-text); font-weight: 700; font-size: 14px; }
  .tile .now { position: absolute; top: 7px; left: 7px; font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; background: rgba(0,0,0,.6); color: #fff; }
  .tile[hidden], .group[hidden] { display: none; }
  .actions { position: sticky; bottom: 0; display: flex; gap: 10px; margin: 16px -12px calc(-16px - var(--bottom)); padding: 12px 12px calc(12px + var(--bottom)); background: var(--bg); border-top: 1px solid var(--sep); }
  .back { color: var(--accent); font-weight: 500; padding: 4px 4px 10px; }
  .panel { background: var(--card); border-radius: 14px; padding: 12px; }
  .seg { display: flex; padding: 3px; border-radius: 10px; background: color-mix(in srgb, var(--hint) 16%, transparent); }
  .seg button { flex: 1; padding: 7px 8px; border-radius: 8px; font-weight: 500; }
  .seg button.on { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .stepper { display: flex; align-items: center; gap: 12px; padding: 16px 0 4px; text-align: center; }
  .stepper > div { flex: 1; }
  .stepper button { width: 52px; height: 52px; border-radius: 50%; font-size: 26px; line-height: 1; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
  .stepper button:disabled { opacity: .35; cursor: default; }
  .count { font-size: 40px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .note { margin: 10px 4px 0; }

  .spin { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .message { text-align: center; padding: 22vh 24px 0; }
  .message .icon { font-size: 52px; }
  .message h1 { font-size: 20px; margin: 12px 0 6px; }
  .message p { color: var(--hint); margin: 0; }
  .plan { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; }
  .plan .emoji { font-size: 24px; }
  .plan .go { margin-left: auto; color: var(--hint); font-size: 20px; }
  .toast { position: fixed; left: 50%; bottom: calc(86px + var(--bottom)); transform: translate(-50%, 20px); max-width: calc(100% - 32px); width: max-content; padding: 10px 16px; border-radius: 12px; background: rgba(30, 30, 30, .92); color: #fff; font-size: 14px; opacity: 0; transition: .2s; pointer-events: none; z-index: 10; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.bad { background: var(--danger); }
  .power { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }
  .note-line { font-size: 13px; color: var(--hint); margin: 2px 0 12px; }
  .note-line.bad { color: var(--danger); }
  .working { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .lock { display: inline-flex; align-items: center; gap: 5px; margin: 0 0 10px; padding: 4px 11px; border-radius: 99px; font-size: 13px; font-weight: 500; background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }
</style>
</head>
<body>
<main id="app"><div class="message"><div class="spin" style="margin: 0 auto"></div></div></main>
<div id="toast" class="toast"></div>
<script>
const tg = window.Telegram && Telegram.WebApp;
const INIT = tg ? tg.initData : "";
const PLAN = "/bot/";  // the planner bot's Plan page (services/bot), behind the same Caddy
const app = document.getElementById("app");
let fleet = null;   // /tg/api/fleet: every server, off or on
let view = null;    // the open screen: {kind: "map", name, mode, map} or {kind: "bots", name, fill, add, skill}
let busy = false;
const BOT_ICON = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="4" y="8" width="16" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 8V4M9 13h.01M15 13h.01M2 13v2M22 13v2" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';
const POWER_ICON = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 3v8M6.3 6.3a8 8 0 1 0 11.4 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"})[c]);
const thumb = (name, map) => `/tg/thumb/${encodeURIComponent(name)}/${encodeURIComponent(map)}.jpg`;
const haptic = kind => { try { tg.HapticFeedback.notificationOccurred(kind); } catch (e) {} };
const tick = () => { try { tg.HapticFeedback.selectionChanged(); } catch (e) {} };
const nativeBack = () => tg && tg.isVersionAtLeast("6.1");
const server = name => fleet.servers.find(s => s.name === name);
const clock = ts => new Date(ts * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
const day = ts => new Date(ts * 1000).toLocaleString([], {weekday: "short", hour: "2-digit", minute: "2-digit"});

async function api(path, body) {
  const r = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: body ? {Authorization: "tma " + INIT, "Content-Type": "application/json"} : {Authorization: "tma " + INIT},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) {
    const err = new Error(typeof data.detail === "string" ? data.detail : `the bastion answered ${r.status}`);
    err.code = r.status;
    throw err;
  }
  return data;
}

function message(icon, title, text) {
  app.innerHTML = `<div class="message"><div class="icon">${icon}</div><h1>${esc(title)}</h1><p>${esc(text)}</p></div>`;
}

let toastTimer;
function toast(text, bad) {
  const t = document.getElementById("toast");
  t.textContent = text;
  t.className = "toast show" + (bad ? " bad" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = "toast" + (bad ? " bad" : ""), bad ? 5000 : 3000);
}

function confirmed(text) {
  return new Promise(resolve => tg && tg.isVersionAtLeast("6.2") ? tg.showConfirm(text, resolve) : resolve(confirm(text)));
}

async function refresh() {
  try {
    fleet = await api("/tg/api/fleet");
  } catch (e) {
    if (view) return;
    if (e.code === 403) return message("🔒", "Only for the group", "Only members of the group can use this.");
    if (e.code === 401) return message("🔄", "Open it again", "Close this and open it again from the group.");
    if (!fleet) return message("⚠️", "Can't reach the servers", e.message);
    return;
  }
  if (!view) renderList();
}

// a screen over the list (map picker, bots), with Telegram's back button
function openView(v, html) {
  view = v;
  app.innerHTML = `<div class="screen">${nativeBack() ? "" : '<button class="back" onclick="closeView()">‹ Back</button>'}${html}</div>`;
  if (nativeBack()) tg.BackButton.show();
  window.scrollTo(0, 0);
}

function closeView() {
  if (busy) return;
  view = null;
  if (nativeBack()) tg.BackButton.hide();
  renderList();
  refresh();
}

// runs a save from a screen's main button: spinner while it runs, back to the list when done
async function submit(btn, working, request, done) {
  busy = true;
  const label = btn.textContent;
  btn.innerHTML = `<span class="spin"></span>${working}`;
  app.querySelectorAll(".actions button").forEach(b => b.disabled = true);
  try {
    await request();
    haptic("success");
    busy = false;
    closeView();
    toast(done);
  } catch (e) {
    haptic("error");
    busy = false;
    btn.textContent = label;
    app.querySelectorAll(".actions button").forEach(b => b.disabled = false);
    if (view.kind === "map") updatePicker();
    toast(e.message, true);
  }
}

// ---------- the servers ----------

function renderList() {
  const plan = `<button class="card plan" onclick="openPlan()"><span class="emoji">📅</span>
      <span><b>Plan</b><br><span class="hint">Your free hours and the best times for everyone</span></span><span class="go">›</span></button>`;
  const cards = fleet.servers.map(card).join("");
  app.innerHTML = plan + (cards || `<div class="message"><div class="icon">🛰</div><h1>No servers yet</h1><p>The bastion has no cloud API key.</p></div>`);
}

// the Plan page gets Telegram's launch data in its address, as Telegram does
function openPlan(replace) {
  const params = new URLSearchParams({tgWebAppData: INIT, tgWebAppVersion: tg.version, tgWebAppPlatform: tg.platform,
    tgWebAppThemeParams: JSON.stringify(tg.themeParams)});
  location[replace ? "replace" : "assign"](`${PLAN}#${params}`);
}

// open to everyone or password protected: a small chip on the card that flips it
function lockChip(s) {
  if (!s.lockable) return "";
  return `<button class="lock" onclick="toggleLock('${s.name}')">${s.public ? "🌐 Open to everyone" : "🔒 Password"}</button>`;
}

async function toggleLock(name) {
  const s = server(name), open = !s.public;
  const text = open ? `Open ${s.title} to everyone until it shuts down? Anyone can join without the password.`
    : `Password protect ${s.title}? New players need the password.`;
  const when = s.status === "running" ? " Nobody playing is kicked." : " It applies from its next boot.";
  if (!await confirmed(text + when)) return;
  try {
    await api(`/tg/api/servers/${name}/${open ? "public" : "protect"}`, {});
    haptic("success");
    toast(`${s.title}: ${open ? "open to everyone" : "password protected"}`);
  } catch (e) { haptic("error"); toast(e.message, true); }
  refresh();
}

function card(s) {
  const g = s.status === "running" ? s.game : null;
  const match = g && g.status === "match";
  const players = match ? g.players : [];
  let status, cls = "warn", title, sub = "", body;
  if (s.status === "running") {
    status = !g ? "Not answering" : match ? (players.length ? `${players.length} playing` : "No players") : g.status === "lobby" ? "Lobby" : "Starting";
    cls = match && players.length ? "on" : g ? "" : "warn";
    title = match ? esc(g.map_name) : "Between matches";
    sub = match ? esc(g.mode_name) : "";
    const people = players.length ? esc(players.join(", ")) : `<span class="hint">Nobody playing</span>`;
    const bots = g && g.bots ? `<span class="hint"> · ${g.bots} bot${g.bots > 1 ? "s" : ""}</span>` : "";
    const until = s.reason === "scheduled" ? `Scheduled until ${clock(s.stops_at)}`
      : s.reason === "idle" && s.stops_at ? `Shuts down at ${clock(s.stops_at)} unless someone joins` : "";
    body = `${lockChip(s)}<div class="players">${people}${bots}</div>
      <div class="hint">connect ${esc(s.domain)}${until ? " · " + until : ""}</div>
      <div class="row" style="margin-top: 12px">
        <button class="primary" onclick="openPicker('${s.name}')" ${g ? "" : "disabled"}>Change map or mode</button>
        <button class="secondary icon" onclick="openBots('${s.name}')" ${g ? "" : "disabled"} aria-label="Bots" title="Bots">${BOT_ICON}</button>
        <button class="secondary icon power" onclick="shutdown('${s.name}')" aria-label="Shut down" title="Shut down">${POWER_ICON}</button>
      </div>`;
  } else if (s.status === "provisioning" || s.status === "booting") {
    status = "Starting";
    title = "Booting…";
    body = `<div class="working"><span class="spin"></span><span>${esc(s.step || "starting")}</span></div>
      <div class="note-line">Ready in about 5 minutes (the first boot also downloads the game). The group gets a message.</div>
      <button class="secondary" onclick="shutdown('${s.name}')">Cancel</button>`;
  } else if (s.status === "stopping") {
    status = "Shutting down";
    title = "Shutting down…";
    body = `<div class="working"><span class="spin"></span><span>${esc(s.step || "")}</span></div>`;
  } else {
    status = s.status === "failed" ? "Failed" : "Off";
    cls = s.status === "failed" ? "warn" : "";
    title = s.status === "failed" ? "Didn't start" : "Off";
    const next = s.next_window ? `Scheduled next: ${day(s.next_window.start)}` : "No schedule";
    const hold = s.hold_off_until && s.hold_off_until > fleet.now ? ` · shut down until ${clock(s.hold_off_until)}` : "";
    body = `${s.status === "failed" && s.error ? `<div class="note-line bad">${esc(s.error)}</div>` : ""}
      <div class="note-line">${next}${hold}</div>
      ${lockChip(s)}
      <button class="primary" onclick="boot('${s.name}')" ${s.busy ? "disabled" : ""}>Boot ${esc(s.title)}</button>`;
  }
  const banner = match ? ` style="background-image: url('${thumb(s.name, g.map)}')"` : "";
  return `<section class="card">
    <div class="banner"${banner}><div class="top"><span class="server">${esc(s.title)}</span><span class="status ${cls}">${esc(status)}</span></div>
      <div class="bottom"><div class="map">${title}</div>${sub ? `<div class="mode">${sub}</div>` : ""}</div></div>
    <div class="body">${body}</div>
  </section>`;
}

async function boot(name) {
  const s = server(name);
  if (!await confirmed(`Boot ${s.title}? It shuts itself down ${fleet.idle_minutes} min after the last player leaves (or after it comes up, if nobody joins).`)) return;
  try {
    await api(`/tg/api/servers/${name}/boot`, {});
    haptic("success");
    toast(`${s.title}: booting, the group gets a message when it's up`);
  } catch (e) { haptic("error"); toast(e.message, true); }
  refresh();
}

async function shutdown(name) {
  const s = server(name);
  const n = s.game && s.game.status === "match" ? s.game.players.length : 0;
  const who = n ? ` ${n} player${n > 1 ? "s are" : " is"} on it.` : "";
  const hold = s.reason === "scheduled" ? " It stays off until its schedule window ends." : "";
  if (!await confirmed(`Shut down ${s.title}?${who}${hold}`)) return;
  try {
    await api(`/tg/api/servers/${name}/shutdown`, {});
    haptic("success");
    toast(`${s.title}: shutting down`);
  } catch (e) { haptic("error"); toast(e.message, true); }
  refresh();
}

// ---------- map and mode ----------

function openPicker(name) {
  const s = server(name), g = s.game;
  const tiles = maps => maps.map(m => `<button class="tile" data-id="${esc(m.id)}" data-stock="${m.stock ? 1 : ""}" onclick="pickMap(this)">
      <div class="img" style="background-image: url('${thumb(name, m.id)}')"></div>
      ${m.id === g.map ? '<span class="now">Now</span>' : ""}<span class="name">${esc(m.name)}</span></button>`).join("");
  const stock = g.maps.filter(m => m.stock), more = g.maps.filter(m => !m.stock);
  openView({kind: "map", name, mode: g.modes.some(m => m.id === g.mode) ? g.mode : "war", map: null}, `
    <header><h1>${esc(s.title)}</h1><div class="hint">${g.status === "match" ? `Now: ${esc(g.map_name)} · ${esc(g.mode_name)}` : "No match running"}</div></header>
    <div class="label">Mode</div>
    <div class="chips">${g.modes.map(m => `<button class="chip" data-mode="${esc(m.id)}" onclick="pickMode(this)">${esc(m.name)}</button>`).join("")}</div>
    <div class="group"><div class="label">Original maps</div><div class="grid">${tiles(stock)}</div></div>
    <div class="group more"${more.length ? "" : " hidden"}><div class="label">More maps</div><div class="grid">${tiles(more)}</div></div>
    <div class="actions">
      <button class="secondary" id="next" onclick="play(false)">Next match</button>
      <button class="primary" id="now" onclick="play(true)">Start now</button>
    </div>`);
  updatePicker();
}

function pickMode(el) { if (!busy) { view.mode = el.dataset.mode; updatePicker(); } }
function pickMap(el) { if (!busy) { view.map = el.dataset.id; updatePicker(); tick(); } }

// marks the picks; Search & Destroy has only the original maps
function updatePicker() {
  const sd = view.mode === "sd";
  app.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c.dataset.mode === view.mode));
  app.querySelectorAll(".tile").forEach(t => {
    t.hidden = sd && !t.dataset.stock;
    if (t.hidden && t.dataset.id === view.map) view.map = null;
    t.classList.toggle("on", t.dataset.id === view.map);
  });
  app.querySelector(".more").hidden = sd || !app.querySelector(".more .tile");
  for (const id of ["next", "now"]) document.getElementById(id).disabled = !view.map || busy;
}

async function play(now) {
  if (!view.map || busy) return;
  const {name, map, mode} = view, s = server(name), g = s.game;
  const what = `${g.maps.find(m => m.id === map).name} · ${g.modes.find(m => m.id === mode).name}`;
  if (now && !await confirmed(`Switch ${s.title} to ${what} now?${g.status === "match" ? " The running match ends for everyone." : ""}`)) return;
  submit(document.getElementById(now ? "now" : "next"), now ? "Switching…" : "Saving…",
    () => api(`/tg/api/servers/${name}/play`, {map, mode, now}),
    now ? `${s.title}: now ${what}` : `${s.title}: next match ${what}`);
}

// ---------- bots ----------

function openBots(name) {
  const s = server(name), g = s.game;
  openView({kind: "bots", name, ...g.bot_settings}, `
    <header><h1>Bots</h1><div class="hint">${esc(s.title)}${g.status === "match" ? ` · ${g.bots} in the match now` : ""}</div></header>
    <div class="label">How many</div>
    <div class="panel">
      <div class="seg"><button data-add="" onclick="setAdd(false)">Fill up</button><button data-add="1" onclick="setAdd(true)">Add on top</button></div>
      <div class="stepper">
        <button onclick="stepBots(-1)" aria-label="Fewer">−</button>
        <div><div class="count" id="count"></div><div class="hint" id="what"></div></div>
        <button onclick="stepBots(1)" aria-label="More">+</button>
      </div>
    </div>
    <div class="label">Skill</div>
    <div class="chips">${g.bot_skills.map(k => `<button class="chip" data-skill="${esc(k.id)}" onclick="setSkill(this)">${esc(k.name)}</button>`).join("")}</div>
    <div class="hint note">1 is the easiest, 7 the hardest. Mixed gives each bot a skill of its own.</div>
    <div class="actions"><button class="primary" id="save" onclick="saveBots()">Save</button></div>`);
  updateBots();
}

function setAdd(add) { if (!busy) { view.add = add; updateBots(); tick(); } }
function stepBots(d) { if (!busy) { view.fill = Math.max(0, Math.min(17, view.fill + d)); updateBots(); tick(); } }
function setSkill(el) { if (!busy) { view.skill = el.dataset.skill; updateBots(); tick(); } }

function updateBots() {
  app.querySelectorAll(".seg button").forEach(b => b.classList.toggle("on", !!b.dataset.add === view.add));
  app.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c.dataset.skill === view.skill));
  document.getElementById("count").textContent = view.fill;
  document.getElementById("what").textContent = !view.fill ? "no bots"
    : view.add ? `bot${view.fill > 1 ? "s" : ""} on top of the players`
    : "players in total: bots take the empty spots";
  const [less, more] = app.querySelectorAll(".stepper button");
  less.disabled = view.fill <= 0;
  more.disabled = view.fill >= 17;
}

function saveBots() {
  if (busy) return;
  const {name, fill, add, skill} = view;
  submit(document.getElementById("save"), "Saving…", () => api(`/tg/api/servers/${name}/bots`, {fill, add, skill}),
    `${server(name).title}: bots saved`);
}

// ---------- start ----------

if (!INIT) {
  message("🎮", "Open this in Telegram", "Tap 🎮 Servers under a message of the bot in the group.");
} else {
  tg.ready();
  tg.expand();
  try { tg.setHeaderColor("secondary_bg_color"); tg.setBackgroundColor("secondary_bg_color"); } catch (e) {}
  if (nativeBack()) tg.BackButton.onClick(closeView);
  if (tg.initDataUnsafe.start_param === "plan") openPlan(true);  // t.me/<bot>?startapp=plan
  else refresh();
  setInterval(() => { if (!view && !document.hidden) refresh(); }, 5000);
}
</script>
</body>
</html>

[alembic]
prepend_sys_path = .
path_separator = os
script_location = migrations
# the control plane sets the database itself (control/db.py); this one is for the alembic CLI
sqlalchemy.url = sqlite:///control.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s: %(message)s

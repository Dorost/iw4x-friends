[project]
name = "iw4x-control"
version = "0.1.0"
description = "The bastion's control plane: creates, schedules and destroys the game servers"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "cryptography>=44",
    "fastapi>=0.115",
    "httpx>=0.28",
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = ["black>=24.10", "pytest>=8.3", "ruff>=0.8"]

[tool.uv]
package = false

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
